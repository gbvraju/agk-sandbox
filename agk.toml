# agk configuration. Read by the checks (earlier installs kept the stamp in pyproject.toml [tool.agk]).
mode = "init"
version = "0.9.0"
installed = "2026-10-14"
default_branch = "main"
test_dirs = ["tests"]
lint_paths = ["scripts/agk", "tests/kit", ".claude/hooks"]
# The project's own tests (run by agk-project-test; exit 5 = none collected is success).
project_tests = "python3 -m pytest tests -q --ignore=tests/kit_dev; rc=$?; [ $rc -eq 5 ] && exit 0; exit $rc"
